name: Changeset status

# Comments on each PR with the release its changesets will make, or a
# reminder when it has none. It doesn't block merging.
#
# pull_request_target lets this comment on PRs from forks. It only reads the
# PR's files and never runs its code.
#
# From https://changesets.dev/guide/automating (non-blocking).

on:
  pull_request_target:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  pr-status:
    # The Version Packages PR never has changesets
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      comment-body: ${{ steps.pr-status.outputs.comment-body }}
    steps:
      - uses: actions/checkout@v7
      - id: pr-status
        uses: changesets/action/pr-status@v2

  pr-comment:
    needs: pr-status
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - uses: changesets/action/pr-comment@v2
        with:
          body: ${{ needs.pr-status.outputs.comment-body }}
